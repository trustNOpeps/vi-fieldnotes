name: Editorial studio source and safety checks
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'studio/**'
      - 'tests/test_studio.py'
      - '.github/workflows/editorial-studio*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'studio/**'
      - 'tests/test_studio.py'
      - '.github/workflows/editorial-studio*.yml'
permissions:
  contents: read
jobs:
  studio-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install renderer dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate curated source ledger
        run: python studio/pipeline.py check --date 2026-11-16
      - name: Unit tests, no publication
        run: python -m unittest discover -s tests -p 'test_studio.py' -v
